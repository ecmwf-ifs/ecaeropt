# SULFATE AEROSOL (For Tim's study on Stratospheric Aerosol)
#
# Last update: 22-10-26
# Contact:     ramiro.checa-garcia@ecmwf.int


[distribution]
# Properties of Size Distribution
# Units:
lognormal.r0          = 0.10
lognormal.sigma_g     = 1.50
lognormal.Ntot        = 1.0

[bins]
# Bins for final output
# Units:
min    = 0.005
max    = 20.0

[properties]
# Physical and Chemical properties
rho         = 1.67e03
rh.tab      = 0.0
rh.growth   = 1.0

[optical]
# Optical information
ri_file     = "data/refr_idx/ssu_ri_Palmer_Lund_combined"
wl_out_file = "data/wavelengths/wl_out_IFS.txt"
ext_scaling = 1.0

[tags]
opt_model   = "PW1975_LM2003"
aer_type    = "stratospheric_sulfate"
model       = "Sulphuric acid 75% Palmer and Williams (1975) and Lund Myhre et al (2003)"
ifs         = "CY49R1"
revised     = 2023-02-14

